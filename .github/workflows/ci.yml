name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      # Builds the packages first, which the tests of the examples' types need.
      - run: pnpm typecheck
      - run: pnpm test:full

  # Every template on every target, with each database and storage once. See scripts/template-matrix.mjs.
  template-matrix:
    name: List templates
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.list.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "include=$(node scripts/template-matrix.mjs)" >> "$GITHUB_OUTPUT"

  templates:
    name: ${{ matrix.framework }}/${{ matrix.template }} on ${{ matrix.target }} (${{ matrix.database }}, ${{ matrix.storage }})
    needs: template-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.template-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tarball
      - run: node scripts/smoke-template.mjs ${{ matrix.framework }} ${{ matrix.target }} ${{ matrix.database }} ${{ matrix.storage }} ${{ matrix.template }}
